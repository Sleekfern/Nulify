<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nulify - Online Mode</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #1a1a1a;
            color: #f4f4f9;
        }
        .navbar {
            background-color: #1a1a1a;
            border-bottom: 1px solid #333;
        }
        .card {
            background-color: #2a2a2a;
            border: 1px solid #333;
        }
        .btn-primary {
            background-color: #00aaff;
            border-color: #00aaff;
        }
        .btn-primary:hover {
            background-color: #0088cc;
            border-color: #0088cc;
        }
        #video-feed {
            width: 100%;
            max-width: 800px;
            height: auto;
            border: 2px solid #333;
            border-radius: 8px;
        }
        .form-control {
            background-color: #2a2a2a;
            border-color: #333;
            color: #f4f4f9;
        }
        .form-control:focus {
            background-color: #2a2a2a;
            border-color: #00aaff;
            color: #f4f4f9;
            box-shadow: 0 0 0 0.25rem rgba(0, 170, 255, 0.25);
        }
        .form-label {
            color: #f4f4f9;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="/">
                <img src="/static/logo.png" alt="Nulify" height="30">
            </a>
            <div class="navbar-nav">
                <a class="nav-link active" href="/">Home</a>
                <a class="nav-link" href="/measurements">Measurements</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="row">
            <div class="col-md-8">
                <div class="card mb-4">
                    <div class="card-body">
                        <h5 class="card-title">Live Feed</h5>
                        <img id="video-feed" src="{{ url_for('video_feed') }}" alt="Video Feed">
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Settings</h5>
                        <form id="settingsForm">
                            <div class="mb-3">
                                <label for="minWidth" class="form-label">Min Width (cm)</label>
                                <input type="number" class="form-control" id="minWidth" step="0.1" required>
                            </div>
                            <div class="mb-3">
                                <label for="maxWidth" class="form-label">Max Width (cm)</label>
                                <input type="number" class="form-control" id="maxWidth" step="0.1" required>
                            </div>
                            <div class="mb-3">
                                <label for="minHeight" class="form-label">Min Height (cm)</label>
                                <input type="number" class="form-control" id="minHeight" step="0.1" required>
                            </div>
                            <div class="mb-3">
                                <label for="maxHeight" class="form-label">Max Height (cm)</label>
                                <input type="number" class="form-control" id="maxHeight" step="0.1" required>
                            </div>
                            <div class="mb-3">
                                <label for="arucoSize" class="form-label">ArUco Size (cm)</label>
                                <input type="number" class="form-control" id="arucoSize" step="0.1" required>
                            </div>
                            <button type="submit" class="btn btn-primary">Apply Settings</button>
                            <button type="button" class="btn btn-secondary" onclick="resetSettings()">Reset</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('settingsForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const formData = {
                min_width: parseFloat(document.getElementById('minWidth').value),
                max_width: parseFloat(document.getElementById('maxWidth').value),
                min_height: parseFloat(document.getElementById('minHeight').value),
                max_height: parseFloat(document.getElementById('maxHeight').value)
            };
            
            fetch('/set_size_range', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(formData)
            });

            fetch('/set_aruco_size', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    aruco_size: parseFloat(document.getElementById('arucoSize').value)
                })
            });
        });

        function resetSettings() {
            fetch('/reset_size_range', {
                method: 'POST'
            });
            document.getElementById('settingsForm').reset();
        }
    </script>
</body>
</html>
