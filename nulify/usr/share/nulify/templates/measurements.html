<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nulify - Measurements</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <style>
        .measurements-container {
            flex-direction: column;
            align-items: center;
        }
        
        .measurements-table {
            width: 100%;
            max-width: 800px;
            margin: 20px auto;
            border-collapse: collapse;
            background-color: #1a1a1a;
            box-shadow: 0 4px 10px #00000080;
            border-radius: 10px;
            overflow: hidden;
        }

        .measurements-table th,
        .measurements-table td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #333;
        }

        .measurements-table th {
            background-color: #00aaff;
            color: #1a1a1a;
            font-weight: bold;
        }

        .measurements-table tr:hover {
            background-color: #222;
        }

        .mode-badge {
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 0.9em;
        }

        .mode-online {
            background-color: #00aaff;
            color: #1a1a1a;
        }

        .mode-offline {
            background-color: #444;
            color: #f4f4f9;
        }

        .nav-links {
            text-align: center;
            margin-bottom: 20px;
        }

        .nav-links a {
            color: #00aaff;
            text-decoration: none;
            margin: 0 10px;
        }

        .nav-links a:hover {
            text-decoration: underline;
        }

        .object-name {
            font-weight: bold;
            color: #00aaff;
        }

        .clear-button {
            max-width: 200px;
            margin: 20px auto;
        }
    </style>
</head>

<body>
    <div class="container measurements-container">
        <div class="nav-links">
            <a href="/">← Back to Camera</a>
        </div>

        <h1>NULIFY</h1>
        <h2 style="text-align: center; color: #f4f4f9;">Stored Measurements</h2>

        <button onclick="clearMeasurements()" class="clear-button">Clear All Measurements</button>

        <table class="measurements-table">
            <thead>
                <tr>
                    <th>Object</th>
                    <th>Width (cm)</th>
                    <th>Height (cm)</th>
                    <th>Mode</th>
                    <th>Time</th>
                </tr>
            </thead>
            <tbody id="measurementsTable">
                <!-- Data will be populated by JavaScript -->
            </tbody>
        </table>
    </div>

    <script>
        function getObjectName(width, height) {
            // Define size ranges for industrial objects
            const objects = [
                // Hex nuts - various standard sizes
                { name: "M6 Hex Nut", minW: 0.9, maxW: 1.1, minH: 0.9, maxH: 1.1 },
                { name: "M8 Hex Nut", minW: 1.2, maxW: 1.4, minH: 1.2, maxH: 1.4 },
                { name: "M10 Hex Nut", minW: 1.5, maxW: 1.7, minH: 1.5, maxH: 1.7 },
                { name: "M12 Hex Nut", minW: 1.8, maxW: 2.0, minH: 1.8, maxH: 2.0 },
                { name: "M16 Hex Nut", minW: 2.3, maxW: 2.5, minH: 2.3, maxH: 2.5 },
                
                // Bolts - various lengths
                { name: "M6 Bolt", minW: 0.5, maxW: 0.7, minH: 2.0, maxH: 10.0 },
                { name: "M8 Bolt", minW: 0.7, maxW: 0.9, minH: 2.5, maxH: 12.0 },
                { name: "M10 Bolt", minW: 0.9, maxW: 1.1, minH: 3.0, maxH: 15.0 },
                { name: "M12 Bolt", minW: 1.1, maxW: 1.3, minH: 3.5, maxH: 18.0 },
                
                // Steel Rods - standard diameters
                { name: "6mm Steel Rod", minW: 0.5, maxW: 0.7, minH: 10.0, maxH: 100.0 },
                { name: "8mm Steel Rod", minW: 0.7, maxW: 0.9, minH: 10.0, maxH: 100.0 },
                { name: "10mm Steel Rod", minW: 0.9, maxW: 1.1, minH: 10.0, maxH: 100.0 },
                { name: "12mm Steel Rod", minW: 1.1, maxW: 1.3, minH: 10.0, maxH: 100.0 },
                
                // Pipe Sections - standard sizes
                { name: "1/2\" Pipe Section", minW: 2.0, maxW: 2.2, minH: 2.0, maxH: 30.0 },
                { name: "3/4\" Pipe Section", minW: 2.5, maxW: 2.7, minH: 2.5, maxH: 30.0 },
                { name: "1\" Pipe Section", minW: 3.2, maxW: 3.4, minH: 3.2, maxH: 30.0 },
                { name: "1.5\" Pipe Section", minW: 4.7, maxW: 4.9, minH: 4.7, maxH: 30.0 },
                
                // Flat Steel/Metal Plates
                { name: "Small Metal Plate", minW: 5.0, maxW: 10.0, minH: 5.0, maxH: 10.0 },
                { name: "Medium Metal Plate", minW: 10.0, maxW: 20.0, minH: 10.0, maxH: 20.0 },
                { name: "Large Metal Plate", minW: 20.0, maxW: 30.0, minH: 20.0, maxH: 30.0 }
            ];

            // First try exact match
            for (const obj of objects) {
                if (width >= obj.minW && width <= obj.maxW && 
                    height >= obj.minH && height <= obj.maxH) {
                    return obj.name;
                }
            }

            // If no exact match, try to categorize by type
            if (width === height && width <= 3.0) {
                return "Hex Nut";
            } else if (width < 2.0 && height > width * 3) {
                return "Bolt";
            } else if (width < 2.0 && height > width * 10) {
                return "Steel Rod";
            } else if (Math.abs(width - height) < 1.0 && width > 2.0) {
                return "Pipe Section";
            } else if (width > 5.0 && height > 5.0) {
                return "Metal Plate";
            }

            return "Unknown Object";
        }

        function loadMeasurements() {
            fetch('/api/measurements/all')
                .then(response => response.json())
                .then(data => {
                    const tableBody = document.getElementById('measurementsTable');
                    tableBody.innerHTML = '';
                    
                    data.forEach(measurement => {
                        const objectName = getObjectName(measurement.width, measurement.height);
                        const row = document.createElement('tr');
                        row.innerHTML = `
                            <td class="object-name">${objectName}</td>
                            <td>${measurement.width.toFixed(1)}</td>
                            <td>${measurement.height.toFixed(1)}</td>
                            <td><span class="mode-badge mode-${measurement.mode}">${measurement.mode}</span></td>
                            <td>${new Date(measurement.timestamp).toLocaleString()}</td>
                        `;
                        tableBody.appendChild(row);
                    });
                })
                .catch(error => console.error('Error loading measurements:', error));
        }

        function clearMeasurements() {
            if (confirm('Are you sure you want to clear all measurements?')) {
                fetch('/api/measurements/clear', { method: 'POST' })
                    .then(response => response.json())
                    .then(data => {
                        if (data.status === 'success') {
                            loadMeasurements();
                        } else {
                            alert('Error clearing measurements');
                        }
                    })
                    .catch(error => console.error('Error clearing measurements:', error));
            }
        }

        // Load measurements when the page loads
        document.addEventListener('DOMContentLoaded', loadMeasurements);

        // Refresh measurements every 5 seconds
        setInterval(loadMeasurements, 5000);
    </script>
</body>
</html>
